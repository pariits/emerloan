
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e293b">
<title>EmerLoan · Due Dates</title>
<style>
:root{--pri:#2563eb;--red:#dc2626;--grn:#16a34a;--amb:#f59e0b;--pur:#7c3aed;--teal:#0d9488;--bg:#f1f5f9;--card:#fff;--bdr:#e2e8f0;--txt:#1e293b;--txt2:#64748b;--r:12px;--sh:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--txt);padding-bottom:72px;overflow-x:hidden}
input,select,button{font-family:inherit}
.loading-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.6);z-index:999;justify-content:center;align-items:center;flex-direction:column;gap:12px}
.loading-overlay.show{display:flex}
.lo-spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top:4px solid #fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lo-text{color:#fff;font-size:14px;font-weight:700;text-align:center;max-width:80%}
.login-wrap{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.login-box{background:var(--card);border-radius:16px;padding:32px 24px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center}
.login-box h1{font-size:28px;margin-bottom:4px}
.login-box .ls{color:var(--txt2);font-size:12px;margin-bottom:20px}
.login-box input{width:100%;padding:12px 14px;border:1px solid var(--bdr);border-radius:8px;font-size:15px;margin-bottom:12px}
.login-box input:focus{outline:none;border-color:var(--pri)}
.login-box button{width:100%;padding:12px;background:var(--pri);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.login-box button:active{transform:scale(.98)}
.login-box button:disabled{background:#94a3b8;cursor:not-allowed}
.login-err{color:var(--red);font-size:12px;margin-bottom:8px;min-height:18px}
.app{display:none;padding:16px 14px 20px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hdr h1{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px}
.sub{color:var(--txt2);font-size:11px;margin-bottom:12px}
/* Financer buttons */
.fin-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fin-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border:2px solid var(--bdr);border-radius:20px;background:var(--card);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;color:var(--txt2)}
.fin-btn:active{transform:scale(.95)}
.fin-btn .fin-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fin-btn.active{border-color:currentColor;background:#f8fafc}
.fin-btn[data-fin="All"]{color:var(--txt)}.fin-btn[data-fin="All"] .fin-dot{background:var(--txt)}
.fin-btn[data-fin="All"].active{border-color:var(--txt);background:#f1f5f9}
.fin-btn[data-fin="Axl"]{color:var(--red)}.fin-btn[data-fin="Axl"] .fin-dot{background:var(--red)}
.fin-btn[data-fin="Axl"].active{border-color:var(--red);background:#fef2f2}
.fin-btn[data-fin="Fritz"]{color:var(--pri)}.fin-btn[data-fin="Fritz"] .fin-dot{background:var(--pri)}
.fin-btn[data-fin="Fritz"].active{border-color:var(--pri);background:#eff6ff}
.fin-btn[data-fin="Axlthea"]{color:var(--pur)}.fin-btn[data-fin="Axlthea"] .fin-dot{background:var(--pur)}
.fin-btn[data-fin="Axlthea"].active{border-color:var(--pur);background:#f5f3ff}
.fin-btn .fin-ct{font-size:10px;background:rgba(0,0,0,.08);padding:1px 6px;border-radius:8px}
.fin-btn.active .fin-ct{background:rgba(0,0,0,.12)}
.dp{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.dp input[type="date"]{padding:10px 12px;border:1px solid var(--bdr);border-radius:var(--r);font-size:14px;flex:1;min-width:130px;background:var(--card)}
.dp input:focus{outline:none;border-color:var(--pri)}
.dpb{padding:10px 14px;border:1px solid var(--bdr);border-radius:var(--r);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--txt)}
.dpb:active{background:#f1f5f9}
.dpb.ta{background:var(--pri);color:#fff;border-color:var(--pri)}
.banner{border-radius:var(--r);padding:14px;margin-bottom:12px;text-align:center}
.banner.db{background:#fef2f2;border:1px solid #fecaca}
.banner.pb{background:#f0fdf4;border:1px solid #bbf7d0}
.bl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--txt2)}
.bd{font-size:18px;font-weight:800;font-family:'SF Mono','Cascadia Code',monospace}
.bc2{font-size:12px;font-weight:600;margin-top:2px;color:var(--txt2)}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 10px;text-align:center;box-shadow:var(--sh)}
.dc .dl{color:var(--txt2);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;font-weight:600}
.dc .dv{font-size:18px;font-weight:800;font-family:'SF Mono','Cascadia Code',monospace}
.dv.blue{color:var(--pri)}.dv.red{color:var(--red)}.dv.green{color:var(--grn)}.dv.amber{color:var(--amb)}
.badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;display:inline-block;font-family:system-ui,sans-serif}
.b-paid{background:#dcfce7;color:#166534}.b-pending{background:#fef3c7;color:#92400e}.b-renewed{background:#dbeafe;color:#1e40af}.b-remitted{background:#f3e8ff;color:#6b21a8}
.b-axl{background:#fef2f2;color:var(--red)}.b-fritz{background:#eff6ff;color:var(--pri)}.b-axlthea{background:#f5f3ff;color:var(--pur)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bdr);display:flex;z-index:50;padding:4px 0;padding-bottom:max(4px,env(safe-area-inset-bottom))}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 4px;cursor:pointer;color:var(--txt2);font-size:10px;font-weight:600;border:none;background:none;gap:2px;transition:color .15s}
.ni.active{color:var(--pri)}
.ni .ic{font-size:20px}
.sec{display:none}.sec.active{display:block}
.empty{text-align:center;padding:30px 16px;color:var(--txt2);font-size:13px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-16px);background:var(--txt);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--grn)}.toast.error{background:var(--red)}.toast.info{background:var(--pri)}
.info{background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--r);padding:12px;margin-bottom:12px;font-size:11px;color:#1e40af;line-height:1.6}
.refresh-btn{padding:10px 14px;border:1px solid var(--bdr);border-radius:var(--r);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--pri)}
.refresh-btn:active{background:#f1f5f9;transform:scale(.97)}
/* Compact table */
.ct-wrap{background:var(--card);border:1px solid #c0c0c0;border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:12px}
.ct{width:100%;border-collapse:collapse;font-size:11px}
.ct th{background:#e8eaed;color:#333;font-weight:600;padding:6px 8px;border:1px solid #c0c0c0;font-size:10px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;position:sticky;top:0;z-index:2}
.ct td{padding:5px 8px;border:1px solid #d5d5d5;color:#222;font-family:'SF Mono','Cascadia Code',monospace;font-size:11px;white-space:nowrap;background:#fff}
.ct tr:nth-child(even) td{background:#fafafa}
.ct tr:hover td{background:#f0f4ff}
.ct .right{text-align:right}
.ct .center{text-align:center}
.ct tr.ct-totals td{background:#e8eaed!important;font-weight:700;border-top:2px solid #999;font-family:system-ui,sans-serif}
.ct tr.ct-due td{background:#fff9c3!important;border-color:#e6d98c}
.ct tr.ct-paid td{background:#e8f5e9!important;border-color:#a5d6a7}
.ct-sheet{overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:60vh;overflow-y:auto}
.fin-dot-sm{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:middle}
.fin-dot-sm.axl{background:var(--red)}.fin-dot-sm.fritz{background:var(--pri)}.fin-dot-sm.axlthea{background:var(--pur)}
@media(max-width:640px){.dg{grid-template-columns:repeat(2,1fr)}}
@media(min-width:641px){body{max-width:640px;margin:0 auto}}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay"><div class="lo-spinner"></div><div class="lo-text" id="loadingText">Loading...</div></div>
<div class="login-wrap" id="loginWrap">
<div class="login-box"><h1>📅 EmerLoan</h1><p class="ls">Due Date Checker</p><div class="login-err" id="loginErr"></div><input type="password" id="loginPw" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"><button onclick="doLogin()" id="loginBtn">🔓 Unlock</button></div>
</div>
<div class="app" id="mainApp">
<div class="toast" id="toast"></div>
<div class="hdr"><h1>📅 Due Date Checker</h1><button class="refresh-btn" onclick="loadData()">🔄</button></div>
<p class="sub">Read-only view · 7-Day Cycle · UTC+8</p>
<div class="fin-bar" id="finBar"></div>

<div class="bnav">
<button class="ni active" data-sec="due" onclick="switchSec('due')"><span class="ic">📅</span>Due</button>
<button class="ni" data-sec="paid" onclick="switchSec('paid')"><span class="ic">💰</span>Paid</button>
<button class="ni" data-sec="summary" onclick="switchSec('summary')"><span class="ic">📊</span>Summary</button>
</div>

<div class="sec active" id="sec-due">
<div class="dp"><input type="date" id="duePicker" onchange="saveDueDate();renderDue()"><button class="dpb" onclick="setDueToday()" id="dueTodayBtn">Today</button><button class="dpb" onclick="shiftDue(-1)">◀</button><button class="dpb" onclick="shiftDue(1)">▶</button></div>
<div class="banner db"><div class="bl">Collection Date (UTC+8)</div><div class="bd" id="dueBD" style="color:var(--red)"></div><div class="bc2" id="dueBC"></div></div>
<div id="dueContent"></div>
</div>

<div class="sec" id="sec-paid">
<div class="dp"><input type="date" id="paidPicker" onchange="savePaidDate();renderPaid()"><button class="dpb" onclick="setPaidToday()" id="paidTodayBtn">Today</button><button class="dpb" onclick="shiftPaid(-1)">◀</button><button class="dpb" onclick="shiftPaid(1)">▶</button></div>
<div class="banner pb"><div class="bl">Paid Loans Due On</div><div class="bd" id="paidBD" style="color:var(--grn)"></div><div class="bc2" id="paidBC"></div></div>
<div id="paidContent"></div>
</div>

<div class="sec" id="sec-summary">
<div class="dg" id="sumCards"></div>
<div class="info"><strong>📌 Info:</strong> This is a read-only view. To make changes, use the main EmerLoan app.</div>
<div id="sumList"></div>
</div>
</div>

<script>
var WEB_APP_URL='https://script.google.com/macros/s/AKfycbw6v82DGPxgKK6gKieC210-FbNoyKBXyxNznINOmMsL_TsI8olLlmKjCMeVIXo13xPv/exec';
var PW_HASH='83b749acd0e64b1f847c01a379614c0c96a8095b8dc9916d36a64c10e18559be';
var MAX_ATTEMPTS=5,LOCKOUT_MIN=5,CD=6,UO=8;
var SESSION_KEY='emerloan_dd_session',SESSION_HOURS=8;
var TAB_KEY='emerloan_dd_tab',DUE_DATE_KEY='emerloan_dd_duedate',PAID_DATE_KEY='emerloan_dd_paiddate',FILTER_KEY='emerloan_dd_filter';
var loans=[],curFin='All';

function showLoading(m){document.getElementById('loadingText').textContent=m||'Loading...';document.getElementById('loadingOverlay').classList.add('show')}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show')}
async function hashPw(pw){var e=new TextEncoder().encode(pw);var b=await crypto.subtle.digest('SHA-256',e);return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function checkSession(){var s=localStorage.getItem(SESSION_KEY);if(!s)return false;try{var d=JSON.parse(s);if(d.hash===PW_HASH&&Date.now()<d.expires)return true}catch(e){}localStorage.removeItem(SESSION_KEY);return false}
function saveSession(){localStorage.setItem(SESSION_KEY,JSON.stringify({hash:PW_HASH,expires:Date.now()+(SESSION_HOURS*3600000)}))}

function saveTab(s){localStorage.setItem(TAB_KEY,s)}
function getSavedTab(){return localStorage.getItem(TAB_KEY)||'due'}
function saveDueDate(){localStorage.setItem(DUE_DATE_KEY,document.getElementById('duePicker').value)}
function getSavedDueDate(){return localStorage.getItem(DUE_DATE_KEY)||today()}
function savePaidDate(){localStorage.setItem(PAID_DATE_KEY,document.getElementById('paidPicker').value)}
function getSavedPaidDate(){return localStorage.getItem(PAID_DATE_KEY)||today()}
function saveFilter(f){localStorage.setItem(FILTER_KEY,f)}
function getSavedFilter(){return localStorage.getItem(FILTER_KEY)||'All'}

function initApp(){if(checkSession()){document.getElementById('loginWrap').style.display='none';document.getElementById('mainApp').style.display='block';curFin=getSavedFilter();loadData()}}
function doLogin(){var lo=JSON.parse(localStorage.getItem('emerloan_dd_lockout')||'{}');if(lo.until&&Date.now()<lo.until){document.getElementById('loginErr').textContent='🔒 Locked. Try again in '+Math.ceil((lo.until-Date.now())/60000)+' min.';return}var pw=document.getElementById('loginPw').value;if(!pw){document.getElementById('loginErr').textContent='Enter password';return}hashPw(pw).then(function(h){if(h===PW_HASH){localStorage.removeItem('emerloan_dd_lockout');saveSession();document.getElementById('loginWrap').style.display='none';document.getElementById('mainApp').style.display='block';curFin=getSavedFilter();loadData()}else{var att=(lo.attempts||0)+1;if(att>=MAX_ATTEMPTS){localStorage.setItem('emerloan_dd_lockout',JSON.stringify({attempts:att,until:Date.now()+LOCKOUT_MIN*60000}));document.getElementById('loginErr').textContent='🔒 Locked for '+LOCKOUT_MIN+' minutes.';document.getElementById('loginBtn').disabled=true;setTimeout(function(){document.getElementById('loginBtn').disabled=false;document.getElementById('loginErr').textContent=''},LOCKOUT_MIN*60000)}else{localStorage.setItem('emerloan_dd_lockout',JSON.stringify({attempts:att}));document.getElementById('loginErr').textContent='❌ Wrong password ('+att+'/'+MAX_ATTEMPTS+')'}}})}

function now8(){var n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()*60000)+(UO*3600000))}
function today(){var d=now8();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return('0'+n).slice(-2)}
function addD(ds,n){var p=ds.split('-');var d=new Date(+p[0],+p[1]-1,+p[2],12);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function normDate(v){if(!v)return '';var s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.substring(0,10);var d=new Date(s);if(!isNaN(d.getTime())){var u=new Date(d.getTime()+(d.getTimezoneOffset()*60000)+(UO*3600000));return u.getFullYear()+'-'+p2(u.getMonth()+1)+'-'+p2(u.getDate())}return s}
function fD(ds){if(!ds)return '';var p=ds.split('-');return new Date(+p[0],+p[1]-1,+p[2],12).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function fDY(ds){if(!ds)return '';var p=ds.split('-');return new Date(+p[0],+p[1]-1,+p[2],12).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}
function fDL(ds){var p=ds.split('-');return new Date(+p[0],+p[1]-1,+p[2],12).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}
function fmt(n){return '₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:0})}
function sB(s){return '<span class="badge '+(s==='Paid'?'b-paid':'b-pending')+'">'+s+'</span>'}
function aB(a){if(!a)return '—';if(a.indexOf('Renew')===0)return '<span class="badge b-renewed">'+a+'</span>';if(a==='Remitted')return '<span class="badge b-remitted">Remitted</span>';return a}
function fB(f){if(!f)return '';return '<span class="badge b-'+f.toLowerCase()+'">'+f+'</span>'}
function fDot(f){if(!f)return '';return '<span class="fin-dot-sm '+f.toLowerCase()+'"></span>'}
function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast '+(t||'info')+' show';setTimeout(function(){e.classList.remove('show')},2500)}
function getFL(){var r=loans;if(curFin!=='All')r=r.filter(function(l){return l.financer===curFin});return r}

function selectFin(f){curFin=f;saveFilter(f);renderFinBar();renderAll()}

function renderFinBar(){
  var fins=['All','Axl','Fritz','Axlthea'];
  var h='';
  fins.forEach(function(f){
    var ct=f==='All'?loans.length:loans.filter(function(l){return l.financer===f}).length;
    h+='<button class="fin-btn'+(curFin===f?' active':'')+'" data-fin="'+f+'" onclick="selectFin(\''+f+'\')">';
    h+='<span class="fin-dot"></span>'+f+' <span class="fin-ct">'+ct+'</span></button>';
  });
  document.getElementById('finBar').innerHTML=h;
}

function api(params){
  return new Promise(function(resolve,reject){
    var url=WEB_APP_URL+'?';
    var parts=[];
    for(var key in params){if(params.hasOwnProperty(key)){parts.push(encodeURIComponent(key)+'='+encodeURIComponent(params[key]))}}
    url+=parts.join('&')+'&_t='+Date.now();
    fetch(url,{redirect:'follow',cache:'no-store'})
    .then(function(r){return r.text()})
    .then(function(txt){try{resolve(JSON.parse(txt))}catch(e){reject('Parse error: '+txt.substring(0,100))}})
    .catch(function(e){reject(e)});
  });
}

function parseRow(r){return{id:Number(r.id)||0,name:String(r.name||'').trim(),dateReleased:normDate(r.dateReleased),dueDate:normDate(r.dueDate),amount:Number(r.amount)||0,rate:Number(r.rate)||10,interest:Number(r.interest)||0,total:Number(r.total)||0,remarks:String(r.remarks||'Pending').trim(),action:String(r.action||'').trim(),cycles:Number(r.cycles)||1,financer:String(r.financer||'').trim()}}

function loadData(){showLoading('Loading data...');api({cmd:'get'}).then(function(d){hideLoading();if(d.status==='ok'){loans=d.data.map(parseRow);renderFinBar();switchSec(getSavedTab());toast('✅ Data loaded','success')}else toast('⚠️ '+d.message,'error')}).catch(function(e){hideLoading();toast('⚠️ Connection error','error');console.error(e)})}

function switchSec(s){
  document.querySelectorAll('.sec').forEach(function(el){el.classList.remove('active')});
  document.getElementById('sec-'+s).classList.add('active');
  document.querySelectorAll('.ni').forEach(function(el){el.classList.toggle('active',el.getAttribute('data-sec')===s)});
  saveTab(s);
  if(s==='due'){document.getElementById('duePicker').value=getSavedDueDate();renderDue()}
  if(s==='paid'){document.getElementById('paidPicker').value=getSavedPaidDate();renderPaid()}
  if(s==='summary')renderSummary();
}

function setDueToday(){document.getElementById('duePicker').value=today();saveDueDate();renderDue()}
function shiftDue(n){document.getElementById('duePicker').value=addD(document.getElementById('duePicker').value||today(),n);saveDueDate();renderDue()}
function setPaidToday(){document.getElementById('paidPicker').value=today();savePaidDate();renderPaid()}
function shiftPaid(n){document.getElementById('paidPicker').value=addD(document.getElementById('paidPicker').value||today(),n);savePaidDate();renderPaid()}

function buildTable(items,type){
  var ta=0,ti=0,tt=0;
  var h='<div class="ct-wrap"><div class="ct-sheet"><table class="ct"><thead><tr><th>#</th><th>Name</th><th>Released</th><th>Due</th><th class="right">Capital</th><th>Rate</th><th class="right">Interest</th><th class="right">Total</th><th>Cycle</th></tr></thead><tbody>';
  items.forEach(function(l,i){
    ta+=l.amount;ti+=l.interest;tt+=l.total;
    var rc=type==='due'?'ct-due':'ct-paid';
    h+='<tr class="'+rc+'"><td class="center">'+(i+1)+'</td><td style="font-family:system-ui,sans-serif;font-weight:600">'+fDot(l.financer)+l.name+'</td><td>'+fD(l.dateReleased)+'</td><td>'+fD(l.dueDate)+'</td><td class="right">'+fmt(l.amount)+'</td><td class="center">'+l.rate+'%</td><td class="right">'+fmt(l.interest)+'</td><td class="right">'+fmt(l.total)+'</td><td class="center">#'+l.cycles+'</td></tr>';
  });
  h+='<tr class="ct-totals"><td colspan="4" style="text-align:right">TOTALS</td><td class="right">'+fmt(ta)+'</td><td></td><td class="right">'+fmt(ti)+'</td><td class="right">'+fmt(tt)+'</td><td></td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

function renderDue(){
  var sd=document.getElementById('duePicker').value||today(),fl=getFL();
  document.getElementById('dueTodayBtn').className='dpb'+(sd===today()?' ta':'');
  document.getElementById('dueBD').textContent=fDL(sd);
  var due=fl.filter(function(l){return l.dueDate===sd&&l.remarks==='Pending'});
  document.getElementById('dueBC').textContent=due.length+' pending · '+fmt(due.reduce(function(s,l){return s+l.total},0))+' to collect';
  if(!due.length){document.getElementById('dueContent').innerHTML='<div class="empty">🎉 No pending loans due on this date!</div>';return}
  document.getElementById('dueContent').innerHTML=buildTable(due,'due');
}

function renderPaid(){
  var sd=document.getElementById('paidPicker').value||today(),fl=getFL();
  document.getElementById('paidTodayBtn').className='dpb'+(sd===today()?' ta':'');
  document.getElementById('paidBD').textContent=fDL(sd);
  var paid=fl.filter(function(l){return l.dueDate===sd&&l.remarks==='Paid'});
  document.getElementById('paidBC').textContent=paid.length+' paid · '+fmt(paid.reduce(function(s,l){return s+l.total},0))+' collected';
  if(!paid.length){document.getElementById('paidContent').innerHTML='<div class="empty">📭 No paid loans for this date.</div>';return}
  document.getElementById('paidContent').innerHTML=buildTable(paid,'paid');
}

function renderSummary(){
  var fl=getFL(),names=[],pa=0,pi=0,pt=0,pc=0,td2=today();
  fl.forEach(function(l){if(names.indexOf(l.name)===-1)names.push(l.name);if(l.remarks==='Pending'){pa+=l.amount;pi+=l.interest;pt+=l.total}if(l.remarks==='Paid')pc++});
  var dueToday=fl.filter(function(l){return l.dueDate===td2&&l.remarks==='Pending'}).length;
  document.getElementById('sumCards').innerHTML='<div class="dc"><div class="dl">Borrowers</div><div class="dv blue">'+names.length+'</div></div><div class="dc"><div class="dl">Lent Out</div><div class="dv amber">'+fmt(pa)+'</div></div><div class="dc"><div class="dl">To Collect</div><div class="dv red">'+fmt(pt)+'</div></div><div class="dc"><div class="dl">Interest</div><div class="dv green">'+fmt(pi)+'</div></div><div class="dc"><div class="dl">Due Today</div><div class="dv red">'+dueToday+'</div></div><div class="dc"><div class="dl">Paid</div><div class="dv green">'+pc+'</div></div>';
  var pending=fl.filter(function(l){return l.remarks==='Pending'});
  pending.sort(function(a,b){return a.dueDate<b.dueDate?-1:a.dueDate>b.dueDate?1:a.name.localeCompare(b.name)});
  if(!pending.length){document.getElementById('sumList').innerHTML='<div class="empty">No pending loans.</div>';return}
  var ta=0,ti=0,tt=0;
  var h='<div class="ct-wrap"><div class="ct-sheet"><table class="ct"><thead><tr><th>#</th><th>Name</th><th>Due</th><th class="right">Capital</th><th class="right">Interest</th><th class="right">Total</th><th>Cycle</th></tr></thead><tbody>';
  pending.forEach(function(l,i){
    ta+=l.amount;ti+=l.interest;tt+=l.total;
    var isDue=l.dueDate===td2;
    h+='<tr class="'+(isDue?'ct-due':'')+'"><td class="center">'+(i+1)+'</td><td style="font-family:system-ui,sans-serif;font-weight:600">'+fDot(l.financer)+l.name+'</td><td>'+fD(l.dueDate)+'</td><td class="right">'+fmt(l.amount)+'</td><td class="right">'+fmt(l.interest)+'</td><td class="right">'+fmt(l.total)+'</td><td class="center">#'+l.cycles+'</td></tr>';
  });
  h+='<tr class="ct-totals"><td colspan="3" style="text-align:right">TOTALS</td><td class="right">'+fmt(ta)+'</td><td class="right">'+fmt(ti)+'</td><td class="right">'+fmt(tt)+'</td><td></td></tr>';
  h+='</tbody></table></div></div>';
  document.getElementById('sumList').innerHTML=h;
}

function renderAll(){
  renderFinBar();
  var as=document.querySelector('.ni.active');
  if(as){
    var s=as.getAttribute('data-sec');
    if(s==='due')renderDue();
    if(s==='paid')renderPaid();
    if(s==='summary')renderSummary();
  }
}

initApp();
</script>
</body>
</html>
