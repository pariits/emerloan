
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e293b">
<title>Due Date Checker</title>
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--danger:#dc2626;--success:#16a34a;--warning:#f59e0b;--purple:#7c3aed;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);padding:16px;overflow-x:hidden}
input,select,button{font-family:inherit}

.login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px}
.login-overlay.hidden{display:none}
.login-box{background:var(--card);border-radius:20px;padding:40px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.login-box .logo{font-size:56px;margin-bottom:12px}
.login-box h1{font-size:22px;font-weight:800;margin-bottom:4px}
.login-box .sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.login-box input{width:100%;padding:14px 18px;border:2px solid var(--border);border-radius:var(--radius);font-size:16px;background:#f8fafc;margin-bottom:14px;text-align:center;letter-spacing:2px}
.login-box input:focus{outline:none;border-color:var(--primary)}
.login-box button{width:100%;padding:14px;border:none;border-radius:var(--radius);background:var(--primary);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.login-box button:active{transform:scale(.97)}
.login-error{color:var(--danger);font-size:13px;font-weight:600;margin-bottom:12px;display:none}
.login-box .lock-msg{color:var(--danger);font-size:13px;font-weight:600;margin-bottom:12px;display:none}
.login-box .hint{font-size:11px;color:#94a3b8;margin-top:16px}

.app{display:none}.app.visible{display:block}
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.app-header h1{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.app-header .logout{background:none;border:none;font-size:20px;cursor:pointer;padding:8px}

.conn-bar{border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;font-size:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.conn-bar.setup{background:#fef3c7;border:1px solid #fcd34d;color:#92400e}
.conn-bar.ok{background:#dcfce7;border:1px solid #86efac;color:#166534}
.conn-bar input{flex:1;min-width:180px;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;font-family:monospace}
.conn-bar button{padding:6px 16px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:#fff}
.conn-bar.setup button{background:#f59e0b}
.conn-bar.ok button{background:var(--success)}
.conn-bar.ok button.disc{background:var(--danger)}
.conn-bar .sync{font-size:11px;color:var(--text2)}
.conn-bar.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;display:none}

.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar select{padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;background:var(--card);flex:1;min-width:120px}

.dp-row{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.dp-row input[type="date"]{padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius);font-size:14px;flex:1;min-width:140px}
.dp-row input:focus{outline:none;border-color:var(--primary)}
.dp-btn{padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.dp-btn:active{background:#f1f5f9}
.dp-btn.today-active{background:var(--primary);color:#fff;border-color:var(--primary)}

.banner{border-radius:var(--radius);padding:16px;margin-bottom:12px;text-align:center}
.banner.due{background:#fef2f2;border:1px solid #fecaca}
.b-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--text2)}
.b-date{font-size:18px;font-weight:800;color:var(--danger);font-family:'SF Mono','Cascadia Code',monospace}
.b-count{font-size:12px;font-weight:600;margin-top:2px;color:var(--text2)}

.sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.sum-card .sc-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;font-weight:600}
.sum-card .sc-val{font-size:20px;font-weight:800;font-family:'SF Mono','Cascadia Code',monospace}
.sc-val.red{color:var(--danger)}.sc-val.green{color:var(--success)}

.info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--radius);padding:14px;margin-bottom:16px;font-size:12px;color:#1e40af;line-height:1.7}
.info-box strong{font-weight:700}

.tw{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--text2);font-weight:600;padding:10px;border-bottom:2px solid var(--border);font-size:10px;text-transform:uppercase;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f1f5f9;font-family:'SF Mono','Cascadia Code',monospace;font-size:12px;white-space:nowrap}
tr.totals-row td{background:#f1f5f9;font-weight:700;border-top:2px solid #cbd5e1}
.right{text-align:right}
.section-header{padding:10px 14px;text-align:center;font-size:13px;font-weight:700}
.section-header.pending{background:#fef3c7;color:#92400e}
.section-header.paid{background:#dcfce7;color:#166534}

.badge{padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700;display:inline-block;font-family:system-ui,sans-serif}
.b-paid{background:#dcfce7;color:#166534}
.b-pending{background:#fef3c7;color:#92400e}
.b-renewed{background:#dbeafe;color:#1e40af}
.b-remitted{background:#f3e8ff;color:#6b21a8}
.b-axl{background:#fef2f2;color:#dc2626}
.b-fritz{background:#eff6ff;color:#2563eb}
.b-axlthea{background:#f5f3ff;color:#7c3aed}

/* Mobile cards */
.loan-cards{display:none}
.loan-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.loan-card.pending-card{border-left:4px solid var(--warning)}
.loan-card.paid-card{border-left:4px solid var(--success)}
.lc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lc-name{font-size:15px;font-weight:700}
.lc-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px}
.lc-l{color:var(--text2);font-size:11px}
.lc-v{font-weight:600;font-family:'SF Mono','Cascadia Code',monospace}
.lc-total{background:#f1f5f9;border-radius:var(--radius);padding:12px;text-align:center;margin-top:8px;font-size:13px;font-weight:700}

.empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#1e293b;color:#fff;padding:12px 24px;border-radius:var(--radius);font-size:13px;font-weight:700;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger)}.toast.info{background:var(--primary)}
.loading{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.8);z-index:90;justify-content:center;align-items:center;font-size:14px;color:var(--text2)}
.loading.show{display:flex}
.spinner{width:24px;height:24px;border:3px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .loan-cards{display:block}
  .table-desktop{display:none}
  .sum-grid{grid-template-columns:1fr 1fr}
  body{max-width:100%}
}
@media(min-width:641px){
  .loan-cards{display:none}
  .table-desktop{display:block}
  body{max-width:800px;margin:0 auto}
}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="logo">📅</div>
    <h1>Due Date Checker</h1>
    <p class="sub">Read-only view for handlers</p>
    <div class="login-error" id="loginError"></div>
    <div class="lock-msg" id="lockMsg"></div>
    <input type="password" id="loginPassword" placeholder="Enter password" onkeydown="if(event.key==='Enter')attemptLogin()">
    <button onclick="attemptLogin()">Unlock</button>
    <p class="hint">🔒 Authorized users only</p>
  </div>
</div>

<div class="app" id="app">
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div><span class="spinner"></span>Loading...</div></div>

<div class="app-header">
  <h1>📅 Due Checker</h1>
  <button class="logout" onclick="logout()">🔒</button>
</div>

<div class="conn-bar setup" id="setupBar">
  ⚙️ <strong>Setup:</strong>
  <input type="text" id="urlInput" placeholder="Paste Google Apps Script URL">
  <button onclick="saveUrl()">Connect</button>
</div>
<div class="conn-bar ok" id="okBar" style="display:none">
  ✅ <strong>Connected</strong> <span class="sync" id="syncStatus"></span>
  <div style="display:flex;gap:4px">
    <button onclick="loadLoans()">🔄</button>
    <button class="disc" onclick="resetUrl()">✕</button>
  </div>
</div>
<div class="conn-bar err" id="errBar">⚠️ <span id="errMsg"></span></div>

<div class="toolbar">
  <select id="financerFilter" onchange="render()">
    <option value="All">👤 All Financers</option>
    <option value="Axl">Axl</option>
    <option value="Fritz">Fritz</option>
    <option value="Axlthea">Axlthea</option>
  </select>
</div>

<div class="dp-row">
  <input type="date" id="datePicker" onchange="render()">
  <button class="dp-btn" onclick="setToday()" id="todayBtn">Today</button>
  <button class="dp-btn" onclick="shift(-1)">◀</button>
  <button class="dp-btn" onclick="shift(1)">▶</button>
</div>

<div class="banner due">
  <div class="b-label">Due Date (UTC+8)</div>
  <div class="b-date" id="bannerDate"></div>
  <div class="b-count" id="bannerCount"></div>
</div>

<div class="sum-grid" id="sumCards"></div>

<div class="info-box">
  <strong>📌 Read-only.</strong> Use the main EmerLoan system to make changes. This page auto-refreshes every 30 seconds.
</div>

<div id="content"></div>

</div>

<script>
var PH='83b749acd0e64b1f847c01a379614c0c96a8095b8dc9916d36a64c10e18559be',MA=5,LM=5;
var SK='duedate_s',AK='duedate_a',LK='duedate_l',SD=8*3600000,UO=8;
var WEB='',loans=[],timer=null;

async function hash(s){var e=new TextEncoder().encode(s);var b=await crypto.subtle.digest('SHA-256',e);return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function checkSess(){var s=localStorage.getItem(SK);if(s&&Date.now()-parseInt(s)<SD){unlock();return}document.getElementById('loginOverlay').classList.remove('hidden')}
async function attemptLogin(){
  var lu=localStorage.getItem(LK);if(lu&&Date.now()<parseInt(lu)){document.getElementById('lockMsg').style.display='block';document.getElementById('lockMsg').textContent='🔒 Locked. Try later.';return}
  var h=await hash(document.getElementById('loginPassword').value);
  if(h===PH){localStorage.setItem(SK,Date.now().toString());localStorage.removeItem(AK);localStorage.removeItem(LK);unlock()}
  else{var a=parseInt(localStorage.getItem(AK)||'0')+1;localStorage.setItem(AK,a.toString());if(a>=MA){localStorage.setItem(LK,(Date.now()+LM*60000).toString());localStorage.removeItem(AK);document.getElementById('lockMsg').style.display='block';document.getElementById('lockMsg').textContent='🔒 Locked for '+LM+'m.'}else{document.getElementById('loginError').style.display='block';document.getElementById('loginError').textContent='❌ Wrong. '+(MA-a)+' left.'}document.getElementById('loginPassword').value=''}
}
function unlock(){document.getElementById('loginOverlay').classList.add('hidden');document.getElementById('app').classList.add('visible');init()}
function logout(){localStorage.removeItem(SK);document.getElementById('app').classList.remove('visible');document.getElementById('loginOverlay').classList.remove('hidden');document.getElementById('loginPassword').value='';document.getElementById('loginError').style.display='none';document.getElementById('lockMsg').style.display='none'}

function now8(){var n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()*60000)+(UO*3600000))}
function today(){var d=now8();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return('0'+n).slice(-2)}
function addD(ds,n){var p=ds.split('-');var d=new Date(+p[0],+p[1]-1,+p[2],12);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function fixD(v){if(!v)return '';var s=String(v);if(s.indexOf('T')>-1){var d=new Date(s);var u=d.getTime()+(d.getTimezoneOffset()*60000);var l=new Date(u+UO*3600000);return l.getFullYear()+'-'+p2(l.getMonth()+1)+'-'+p2(l.getDate())}if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;try{var d2=new Date(s);if(!isNaN(d2)){var u2=d2.getTime()+(d2.getTimezoneOffset()*60000);var l2=new Date(u2+UO*3600000);return l2.getFullYear()+'-'+p2(l2.getMonth()+1)+'-'+p2(l2.getDate())}}catch(e){}return s}
function fD(ds){if(!ds)return '';var p=ds.split('-');return new Date(+p[0],+p[1]-1,+p[2],12).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function fDL(ds){var p=ds.split('-');return new Date(+p[0],+p[1]-1,+p[2],12).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}
function fmt(n){return '₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:0})}
function fB(f){if(!f)return '';return '<span class="badge b-'+f.toLowerCase()+'">'+f+'</span>'}
function aB(a){if(!a)return '—';if(a.indexOf('Renew')===0)return '<span class="badge b-renewed">'+a+'</span>';if(a==='Remitted')return '<span class="badge b-remitted">Remitted</span>';return a}
function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast '+(t||'info')+' show';setTimeout(function(){e.classList.remove('show')},3000)}
function showLoad(){document.getElementById('loading').classList.add('show')}
function hideLoad(){document.getElementById('loading').classList.remove('show')}

function init(){WEB=localStorage.getItem('loanAppUrl')||'';updConn();document.getElementById('datePicker').value=today();if(WEB)loadLoans();else render()}
function saveUrl(){var u=document.getElementById('urlInput').value.trim();if(!u||u.indexOf('script.google.com')===-1){alert('Paste valid URL');return}localStorage.setItem('loanAppUrl',u);WEB=u;document.getElementById('errBar').style.display='none';updConn();loadLoans()}
function resetUrl(){localStorage.removeItem('loanAppUrl');WEB='';loans=[];document.getElementById('errBar').style.display='none';updConn();render();if(timer)clearInterval(timer)}
function updConn(){document.getElementById('setupBar').style.display=WEB?'none':'flex';document.getElementById('okBar').style.display=WEB?'flex':'none'}

function api(p,cb){
  if(!WEB){cb('No URL',null);return}
  var u=WEB+'?';var ps=[];for(var k in p)ps.push(encodeURIComponent(k)+'='+encodeURIComponent(p[k]));u+=ps.join('&');
  var done=false;var to=setTimeout(function(){if(!done){done=true;cb('Timeout',null)}},20000);
  fetch(u,{method:'GET',redirect:'follow'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(t){
    if(done)return;done=true;clearTimeout(to);
    try{var d=JSON.parse(t);if(d.loans)d.loans.forEach(function(l){l.dateReleased=fixD(l.dateReleased);l.dueDate=fixD(l.dueDate);l.amount=+l.amount||0;l.rate=+l.rate||0;l.interest=+l.interest||0;l.total=+l.total||0;l.cycles=+l.cycles||1;l.action=l.action||'';l.financer=l.financer||''});cb(null,d)}
    catch(e){cb('Parse error',null)}
  }).catch(function(e){if(done)return;done=true;clearTimeout(to);cb(e.message,null)})
}

function loadLoans(){
  if(!WEB)return;showLoad();document.getElementById('syncStatus').textContent='Syncing...';
  api({action:'getAll'},function(e,d){
    hideLoad();if(e){document.getElementById('errBar').style.display='flex';document.getElementById('errMsg').textContent=e;return}
    document.getElementById('errBar').style.display='none';loans=d&&d.loans?d.loans:[];render();
    document.getElementById('syncStatus').textContent=now8().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
    if(timer)clearInterval(timer);timer=setInterval(function(){if(WEB)loadLoans()},30000)
  })
}

function setToday(){document.getElementById('datePicker').value=today();render()}
function shift(n){var c=document.getElementById('datePicker').value||today();document.getElementById('datePicker').value=addD(c,n);render()}

function render(){
  var sd=document.getElementById('datePicker').value||today();
  var ff=document.getElementById('financerFilter').value;
  document.getElementById('todayBtn').className='dp-btn'+(sd===today()?' today-active':'');
  document.getElementById('bannerDate').textContent=fDL(sd);

  var fl=loans;if(ff!=='All')fl=fl.filter(function(l){return l.financer===ff});
  var due=fl.filter(function(l){return l.dueDate===sd&&l.remarks==='Pending'});
  var paid=fl.filter(function(l){return l.dueDate===sd&&l.remarks==='Paid'});
  document.getElementById('bannerCount').textContent=due.length+' pending · '+paid.length+' paid';

  var da=0,di=0,dt=0,pa=0,pi=0,pt=0;
  due.forEach(function(l){da+=l.amount;di+=l.interest;dt+=l.total});
  paid.forEach(function(l){pa+=l.amount;pi+=l.interest;pt+=l.total});
  document.getElementById('sumCards').innerHTML=
    '<div class="sum-card"><div class="sc-label">To Collect</div><div class="sc-val red">'+fmt(dt)+'</div></div>'+
    '<div class="sum-card"><div class="sc-label">Pending</div><div class="sc-val red">'+due.length+'</div></div>'+
    '<div class="sum-card"><div class="sc-label">Total Paid</div><div class="sc-val green">'+fmt(pt)+'</div></div>'+
    '<div class="sum-card"><div class="sc-label">Paid</div><div class="sc-val green">'+paid.length+'</div></div>';

  var h='';
  /* PENDING */
  if(due.length){
    var ta=0,ti=0,tt=0;
    /* Mobile */
    h+='<div class="loan-cards">';
    due.forEach(function(l){ta+=l.amount;ti+=l.interest;tt+=l.total;
      h+='<div class="loan-card pending-card"><div class="lc-top"><div><span class="lc-name">'+l.name+'</span> '+fB(l.financer)+'</div><span class="badge b-pending">Pending</span></div><div class="lc-grid"><div><div class="lc-l">Amount</div><div class="lc-v">'+fmt(l.amount)+'</div></div><div><div class="lc-l">Interest ('+l.rate+'%)</div><div class="lc-v">'+fmt(l.interest)+'</div></div><div><div class="lc-l">Total</div><div class="lc-v" style="color:var(--danger)">'+fmt(l.total)+'</div></div><div><div class="lc-l">Cycle</div><div class="lc-v">#'+l.cycles+'</div></div></div></div>'});
    h+='<div class="lc-total" style="color:var(--danger)">⏳ Collect: '+fmt(tt)+'</div></div>';
    /* Desktop */
    ta=0;ti=0;tt=0;
    h+='<div class="table-desktop"><div class="tw"><div class="section-header pending">⏳ PENDING — '+fD(sd)+'</div><table><thead><tr><th>#</th><th>Name</th><th>Financer</th><th class="right">Amount</th><th>Rate</th><th class="right">Interest</th><th class="right">Total</th><th>Cycle</th></tr></thead><tbody>';
    due.forEach(function(l,i){ta+=l.amount;ti+=l.interest;tt+=l.total;h+='<tr><td>'+(i+1)+'</td><td>'+l.name+'</td><td>'+fB(l.financer)+'</td><td class="right">'+fmt(l.amount)+'</td><td>'+l.rate+'%</td><td class="right">'+fmt(l.interest)+'</td><td class="right">'+fmt(l.total)+'</td><td>'+l.cycles+'</td></tr>'});
    h+='<tr class="totals-row"><td></td><td colspan="2" style="text-align:right;font-family:system-ui,sans-serif">TOTAL</td><td class="right">'+fmt(ta)+'</td><td></td><td class="right">'+fmt(ti)+'</td><td class="right">'+fmt(tt)+'</td><td></td></tr></tbody></table></div></div>'
  }
  /* PAID */
  if(paid.length){
    var pa2=0,pi2=0,pt2=0;
    h+='<div class="loan-cards" style="margin-top:16px">';
    paid.forEach(function(l){pa2+=l.amount;pi2+=l.interest;pt2+=l.total;
      h+='<div class="loan-card paid-card"><div class="lc-top"><div><span class="lc-name">'+l.name+'</span> '+fB(l.financer)+'</div><span class="badge b-paid">Paid</span></div><div class="lc-grid"><div><div class="lc-l">Amount</div><div class="lc-v">'+fmt(l.amount)+'</div></div><div><div class="lc-l">Interest ('+l.rate+'%)</div><div class="lc-v">'+fmt(l.interest)+'</div></div><div><div class="lc-l">Total Paid</div><div class="lc-v" style="color:var(--success)">'+fmt(l.total)+'</div></div><div><div class="lc-l">Action</div><div class="lc-v">'+aB(l.action)+'</div></div></div></div>'});
    h+='<div class="lc-total" style="color:var(--success)">✅ Paid: '+fmt(pt2)+'</div></div>';
    pa2=0;pi2=0;pt2=0;
    h+='<div class="table-desktop"><div class="tw"><div class="section-header paid">✅ PAID — '+fD(sd)+'</div><table><thead><tr><th>#</th><th>Name</th><th>Financer</th><th class="right">Amount</th><th>Rate</th><th class="right">Interest</th><th class="right">Total</th><th>Action</th><th>Cycle</th></tr></thead><tbody>';
    paid.forEach(function(l,i){pa2+=l.amount;pi2+=l.interest;pt2+=l.total;h+='<tr><td>'+(i+1)+'</td><td>'+l.name+'</td><td>'+fB(l.financer)+'</td><td class="right">'+fmt(l.amount)+'</td><td>'+l.rate+'%</td><td class="right">'+fmt(l.interest)+'</td><td class="right">'+fmt(l.total)+'</td><td>'+aB(l.action)+'</td><td>'+l.cycles+'</td></tr>'});
    h+='<tr class="totals-row"><td></td><td colspan="2" style="text-align:right;font-family:system-ui,sans-serif">TOTAL</td><td class="right">'+fmt(pa2)+'</td><td></td><td class="right">'+fmt(pi2)+'</td><td class="right">'+fmt(pt2)+'</td><td colspan="2"></td></tr></tbody></table></div></div>'
  }
  if(!due.length&&!paid.length)h='<div class="empty">🎉 No loans due on this date!</div>';
  document.getElementById('content').innerHTML=h
}

checkSess()
</script>
</body>
</html>
